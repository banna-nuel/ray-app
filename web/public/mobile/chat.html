<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ray - Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-grow { flex-grow: 1; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .p-4 { padding: 16px; }
    .px-4 { padding-left: 16px; padding-right: 16px; }
    .py-2 { padding-top: 8px; padding-bottom: 8px; }
    .py-3 { padding-top: 12px; padding-bottom: 12px; }
    .rounded-full { border-radius: 9999px; }
    .text-sm { font-size: 14px; }
    .font-medium { font-weight: 500; }
    .font-bold { font-weight: 700; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .overflow-hidden { overflow: hidden; }
    .overflow-y-auto { overflow-y: auto; }
    .flex-shrink-0 { flex-shrink: 0; }
  </style>
</head>
<body class="h-full overflow-hidden">
  <div class="h-full flex flex-col">

    <!-- Header -->
    <header class="flex-shrink-0 h-14 border-b border-border px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="index.html" class="text-text-muted hover:text-text-primary transition-colors">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
      </div>

      <div class="flex flex-col items-center">
        <span id="pc-name" class="text-sm font-bold">PC</span>
      </div>

      <div class="flex items-center">
        <div id="online-indicator" class="w-2 h-2 rounded-full bg-green-500"></div>
      </div>
    </header>

    <!-- Disconnected Banner -->
    <div id="disconnected-banner" class="disconnected-banner hidden">
      PC desconectado. Reconectando...
    </div>

    <!-- Messages Area -->
    <div id="messages-area" class="flex-grow overflow-y-auto p-4 flex flex-col gap-3">
      <!-- Welcome message -->
      <div class="flex flex-col">
        <span class="message-label">Ray</span>
        <div class="message-ray">
          Hola Estoy listo para ayudarte a controlar tu PC. Prueba decirme "abre Chrome" o "sube el volumen".
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div id="typing-indicator" class="hidden px-4">
      <div class="typing message-ray" style="width: fit-content;">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="flex-shrink-0 h-16 border-t border-border px-4 flex items-center gap-3">
      <!-- Input -->
      <input
        type="text"
        id="message-input"
        class="input flex-grow"
        placeholder="Escribe un comando..."
        autocomplete="off"
      >

      <!-- Mic Button -->
      <button id="btn-mic" class="btn btn-outline p-3">
        <i data-lucide="mic" class="w-5 h-5"></i>
      </button>

      <!-- Send Button -->
      <button id="btn-send" class="btn btn-primary p-3" disabled>
        <i data-lucide="send" class="w-5 h-5"></i>
      </button>
    </footer>

  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { getRoom, connectToRoom, sendCommand, subscribeToCommands, subscribeToRoom, getCurrentRoom, disconnect } from './app.js';

    lucide.createIcons();

    const messagesArea = document.getElementById('messages-area');
    const messageInput = document.getElementById('message-input');
    const btnSend = document.getElementById('btn-send');
    const btnMic = document.getElementById('btn-mic');
    const typingIndicator = document.getElementById('typing-indicator');
    const pcName = document.getElementById('pc-name');
    const onlineIndicator = document.getElementById('online-indicator');
    const disconnectedBanner = document.getElementById('disconnected-banner');

    let roomCode = null;
    let roomId = null;
    let pendingCommands = new Map();
    let recognition = null;
    let isRecording = false;

    // Initialize
    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      roomCode = urlParams.get('room');

      if (!roomCode) {
        const stored = localStorage.getItem('ray_current_room');
        if (stored) {
          roomCode = stored;
        } else {
          window.location.href = 'index.html';
          return;
        }
      }

      // Get room info
      const room = await getRoom(roomCode);
      if (!room) {
        alert('Sala no encontrada');
        window.location.href = 'index.html';
        return;
      }

      roomId = room.id;
      await connectToRoom(roomCode);

      pcName.textContent = room.pc_name || 'PC';
      updateOnlineStatus(room.is_online);

      // Subscribe to room updates
      subscribeToRoom(roomId, (updatedRoom) => {
        updateOnlineStatus(updatedRoom.is_online);
      });

      // Subscribe to commands
      subscribeToCommands(roomId, (command) => {
        if (command.status === 'done' && pendingCommands.has(command.id)) {
          pendingCommands.delete(command.id);
          hideTyping();
          addRayMessage(command.message || 'Listo');
        }
      });

      // Init speech recognition
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          const confidence = event.results[0][0].confidence;

          if (confidence > 0.7) {
            messageInput.value = transcript;
            sendMessage();
          }
        };

        recognition.onerror = (event) => {
          console.error('Speech error:', event.error);
          stopRecording();
        };

        recognition.onend = () => {
          stopRecording();
        };
      } else {
        btnMic.style.display = 'none';
      }
    }

    function updateOnlineStatus(isOnline) {
      if (isOnline) {
        onlineIndicator.className = 'w-2 h-2 rounded-full bg-green-500';
        disconnectedBanner.classList.add('hidden');
      } else {
        onlineIndicator.className = 'w-2 h-2 rounded-full bg-red-500';
        disconnectedBanner.classList.remove('hidden');
      }
    }

    function addUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'message-user';
      div.textContent = text;
      messagesArea.appendChild(div);
      scrollToBottom();
    }

    function addRayMessage(text) {
      const container = document.createElement('div');
      container.className = 'flex flex-col';

      const label = document.createElement('span');
      label.className = 'message-label';
      label.textContent = 'Ray';

      const div = document.createElement('div');
      div.className = 'message-ray';
      div.textContent = text;

      container.appendChild(label);
      container.appendChild(div);
      messagesArea.appendChild(container);
      scrollToBottom();
    }

    function showTyping() {
      typingIndicator.classList.remove('hidden');
      scrollToBottom();
    }

    function hideTyping() {
      typingIndicator.classList.add('hidden');
    }

    function scrollToBottom() {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      messageInput.value = '';
      addUserMessage(text);
      showTyping();

      const command = await sendCommand(text);

      if (command) {
        pendingCommands.set(command.id, command);

        // Timeout after 30 seconds
        setTimeout(() => {
          if (pendingCommands.has(command.id)) {
            pendingCommands.delete(command.id);
            hideTyping();
            addRayMessage('Sin respuesta. Verifica que el agente este activo.');
          }
        }, 30000);
      } else {
        hideTyping();
        addRayMessage('Error al enviar el comando. Intenta de nuevo.');
      }
    }

    function startRecording() {
      if (!recognition) return;
      isRecording = true;
      btnMic.classList.add('recording-pulse');
      btnMic.innerHTML = '<i data-lucide="mic-off" class="w-5 h-5 text-red-400"></i>';
      lucide.createIcons();
      recognition.start();
    }

    function stopRecording() {
      isRecording = false;
      btnMic.classList.remove('recording-pulse');
      btnMic.innerHTML = '<i data-lucide="mic" class="w-5 h-5"></i>';
      lucide.createIcons();
    }

    // Event listeners
    messageInput.addEventListener('input', () => {
      btnSend.disabled = !messageInput.value.trim();
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    btnSend.addEventListener('click', sendMessage);

    btnMic.addEventListener('click', () => {
      if (isRecording) {
        recognition.stop();
      } else {
        startRecording();
      }
    });

    // Initialize
    init();
  </script>
</body>
</html>
