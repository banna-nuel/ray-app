<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ray - Conectar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="min-h-screen flex flex-col items-center justify-center p-6">
    <!-- Logo -->
    <div class="mb-8">
      <div class="flex items-center gap-1 text-3xl font-bold">
        <span>Ray</span>
        <span class="text-accent">·</span>
      </div>
    </div>

    <!-- Card -->
    <div class="card w-full">
      <p class="text-center text-text-muted text-sm mb-6">Controla tu PC desde cualquier lugar</p>

      <!-- Code Input -->
      <input
        type="text"
        id="room-input"
        class="input font-mono text-center text-xl uppercase mb-4"
        placeholder="RAY-XXXX"
        maxlength="8"
        autocomplete="off"
      >

      <!-- Connect Button -->
      <button id="btn-connect" class="btn btn-primary w-full">
        Conectar
      </button>

      <!-- Error message -->
      <p id="error-msg" class="text-red-400 text-sm text-center mt-4 hidden">Codigo no encontrado</p>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { getRoom, connectToRoom } from './app.js';

    lucide.createIcons();

    const roomInput = document.getElementById('room-input');
    const btnConnect = document.getElementById('btn-connect');
    const errorMsg = document.getElementById('error-msg');

    // Auto-uppercase input
    roomInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase();
      errorMsg.classList.add('hidden');
    });

    // Format input as RAY-XXXX
    roomInput.addEventListener('blur', () => {
      let value = roomInput.value.replace(/[^A-Z0-9]/g, '');
      if (value.length > 0 && !value.startsWith('RAY-') && value.length <= 4) {
        value = 'RAY-' + value;
      }
      roomInput.value = value;
    });

    // Connect handler
    btnConnect.addEventListener('click', async () => {
      const code = roomInput.value.trim();
      if (!code) return;

      btnConnect.disabled = true;
      btnConnect.textContent = 'Conectando...';

      const room = await getRoom(code);

      if (room) {
        await connectToRoom(code);
        window.location.href = `chat.html?room=${code}`;
      } else {
        errorMsg.classList.remove('hidden');
        btnConnect.disabled = false;
        btnConnect.textContent = 'Conectar';
      }
    });

    // Check for stored room
    const storedRoom = localStorage.getItem('ray_current_room');
    if (storedRoom) {
      window.location.href = `chat.html?room=${storedRoom}`;
    }
  </script>
</body>
</html>
